<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AV 迴路盒查詢 | V12.2</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="迴路盒">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- 沿用您原本完整的 CSS 樣式 (此處省略以節省版面，請直接貼上您原有的 <style> 內容) -->
    <link rel="stylesheet" href="style.css"> 

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('[PWA] SW registered'))
                    .catch(err => console.warn('[PWA] SW failed:', err));
            });
        }
    </script>
</head>
<body>

<div class="header">
    <h1>音視訊迴路盒</h1>
    <div class="version-label">V12.2 XLSX-SYNC</div>
    <div class="search-group">
        <div class="search-row">
            <div class="search-wrap">
                <input type="search" id="searchInput" placeholder="搜尋編號、廳別、線材或接頭…" autocomplete="off">
                <div id="suggestions" class="suggestions"></div>
            </div>
            <button class="icon-btn" id="clearBtn" title="清除">✕</button>
            <button class="icon-btn" id="settingBtn" title="設定">⚙️</button>
        </div>
    </div>
</div>

<div class="content">
    <!-- 設定面板 -->
    <div id="settingsArea" class="card" style="display:none; margin-bottom:16px;">
        <div class="settings-header">
            <span style="font-size:15px; font-weight:600; color:var(--blue);">🛠️ 自訂系統名稱 (Alias)</span>
            <div style="display:flex; gap:10px;">
                <button class="save-btn" id="saveBtn">儲存</button>
                <button class="close-settings" id="closeSettingBtn">✕</button>
            </div>
        </div>
        <div id="aliasList" style="max-height:400px; overflow-y:auto; padding-right:4px;"></div>
    </div>
    
    <!-- 搜尋結果區塊 -->
    <div id="resultArea" style="display:none"></div>
    
    <!-- 預設提示畫面 -->
    <div id="placeholderContainer">
        <div class="placeholder-wrap">
            <div class="ph-icon">🔌</div>
            <div class="ph-title">迴路盒查詢系統</div>
            <div class="ph-card">
                <div class="ph-rule">請在上方輸入關鍵字</div>
                <div class="ph-item">支援查詢迴路盒 ID、廳別或設備名稱。</div>
            </div>
        </div>
    </div>
</div>

<!-- 依序載入資料與邏輯 -->
<script src="tests.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>

</body>
</html>
